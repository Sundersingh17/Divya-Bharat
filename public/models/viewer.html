<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Divya Bharat 3D models</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>body{margin:0;font-family:sans-serif;background:#f3ede2}header{padding:12px 16px}select{font-size:16px;padding:6px}model-viewer{width:100%;height:80vh}</style></head>
<body><header><select id="s"><option value="besan">besan</option><option value="blackgram-dal">blackgram-dal</option><option value="blackgram-wadi">blackgram-wadi</option><option value="chickpea-chhatua">chickpea-chhatua</option><option value="chilli-powder">chilli-powder</option><option value="coconut-oil">coconut-oil</option><option value="combo-breakfast-kit">combo-breakfast-kit</option><option value="combo-cooking-essentials">combo-cooking-essentials</option><option value="groundnut-oil">groundnut-oil</option><option value="jeera-powder">jeera-powder</option><option value="lemongrass-tea">lemongrass-tea</option><option value="milet-papad">milet-papad</option><option value="mix-chhatua-nosugar">mix-chhatua-nosugar</option><option value="mix-chhatua-sugar">mix-chhatua-sugar</option><option value="moong-dal">moong-dal</option><option value="multigrain-aata">multigrain-aata</option><option value="mustard-oil">mustard-oil</option><option value="mustard-pidia">mustard-pidia</option><option value="ragi-chhatua">ragi-chhatua</option><option value="sesame-oil">sesame-oil</option><option value="special-chhatua">special-chhatua</option><option value="splitchickpea-dal">splitchickpea-dal</option><option value="sunflower-oil">sunflower-oil</option><option value="triphala-churna">triphala-churna</option><option value="turmeric-powder">turmeric-powder</option></select> <small>Drag to rotate, scroll to zoom</small></header>
<model-viewer id="m" src="/models/besan.glb" camera-controls auto-rotate shadow-intensity="1" environment-image="neutral" exposure="1.1"></model-viewer>
<script>const m=document.getElementById("m");document.getElementById("s").onchange=e=>m.src="/models/"+e.target.value+".glb";</script></body></html>
